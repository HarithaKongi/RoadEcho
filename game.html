<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROAD ECHO — The Highway Remembers</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:Arial,sans-serif}
#game{display:block;width:100vw;height:100vh;background:#050611}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#12304c99,transparent 40%),#050611;z-index:5}
.panel{width:min(90vw,520px);padding:28px}.sub{letter-spacing:4px;color:#9cb0d2;font-size:12px;font-weight:700}
h1{font-size:clamp(58px,15vw,100px);line-height:.8;margin:18px 0;background:linear-gradient(#fff,#45f4ff,#6870ff);-webkit-background-clip:text;color:transparent}
.tag{font-size:18px;line-height:1.5;color:#dceaff;margin:20px}
button{width:100%;border:1px solid #9ffaff;border-radius:14px;background:linear-gradient(100deg,#087d9a,#5841c9);color:#fff;padding:16px;margin:8px 0;font-weight:800;font-size:17px;letter-spacing:1.5px;cursor:pointer}
#hud{position:fixed;top:14px;left:14px;right:14px;z-index:4;display:none;justify-content:space-between;pointer-events:none}
.box{background:#04081ecc;border:1px solid #45f4ff44;border-radius:10px;padding:9px 13px;font-size:12px}.box b{font-size:17px}
#hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#9cb0d2;font-size:12px;z-index:4;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu"><div class="panel">
<div class="sub">A MEMORY-DRIVEN ARCADE EXPERIENCE</div>
<h1>ROAD<br>ECHO</h1>
<div class="tag">The highway remembers what you did.<br>Then it makes you drive against it.</div>
<button id="start">ENTER THE ECHO</button>
</div></div>
<div id="hud"><div class="box">SCORE <b id="score">0</b></div><div class="box">DIST <b id="dist">0.0</b> km</div></div>
<div id="hint">← → / A D to steer</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const menu=document.getElementById('menu');
const startButton=document.getElementById('start');
const scoreEl=document.getElementById('score');
const distEl=document.getElementById('dist');
const hint=document.getElementById('hint');
let w=0,h=0,dpr=1,playing=false,last=0,score=0,distance=0;
let carX=0, steer=0, speed=160, spawnTimer=0, roadScroll=0, carTilt=0, carBounce=0;
const keys={left:false,right:false};
const traffic=[];

function resize(){
  w=innerWidth; h=innerHeight; dpr=devicePixelRatio||1;
  canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

function startGame(){
  playing=true; score=0; distance=0; carX=0; steer=0; speed=160; spawnTimer=.5; traffic.length=0;
  menu.style.display='none';
  document.getElementById('hud').style.display='flex';
  hint.style.display='block';
  hint.textContent='← → / A D to steer';
  last=performance.now();
  requestAnimationFrame(loop);
}
startButton.addEventListener('click',startGame);

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){keys.left=true;e.preventDefault();}
  if(k==='arrowright'||k==='d'){keys.right=true;e.preventDefault();}
  if(k===' '&&!playing){e.preventDefault();startGame();}
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.left=false;
  if(k==='arrowright'||k==='d')keys.right=false;
});

function spawn(){
  const lanes=[-.62,-.31,0,.31,.62];
  const types=['sedan','suv','sports'];
  const colors=['#e7edf5','#ff4057','#ffc857','#7aa7ff','#8ee7d1'];
  traffic.push({x:lanes[Math.floor(Math.random()*lanes.length)],z:1.1,type:types[Math.floor(Math.random()*types.length)],color:colors[Math.floor(Math.random()*colors.length)]});
}
function update(dt){
  if(!playing)return;

  const input=(keys.right?1:0)-(keys.left?1:0);
  steer += (input-steer)*Math.min(1,dt*12);
  carX += steer*2.35*dt;
  carX=Math.max(-.82,Math.min(.82,carX));
  carTilt += ((steer*0.18)-carTilt)*Math.min(1,dt*10);
  roadScroll=(roadScroll+speed*dt*0.003)%1;
  carBounce=Math.sin(performance.now()*0.012)*(0.8+Math.abs(steer)*2);

  speed=Math.min(280,speed+dt*3);
  distance+=speed*dt/3600;
  score+=speed*dt*.15;

  spawnTimer-=dt;
  if(spawnTimer<=0){spawn();spawnTimer=Math.max(.42,1.05-speed/500);}

  for(const o of traffic)o.z-=dt*(.42+speed/170);
  for(const o of traffic){
    if(o.z<.16&&o.z>-.05&&Math.abs(o.x-carX)<.20){
      playing=false;
      hint.textContent='CRASH — press SPACE to restart';
      return;
    }
  }
  while(traffic.length&&traffic[0].z<-.25)traffic.shift();

  scoreEl.textContent=Math.floor(score);
  distEl.textContent=distance.toFixed(1);
}
function roadX(x,z){return w/2+x*w*.38/(1+z*.72)}
function roadY(z){return h*.31+(1/(1+z*.72))*h*.56}
function drawCar(x,y,s,color,tilt=0,type='sports'){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tilt);
  ctx.scale(s,s);

  // Real-world inspired vehicle silhouettes: sports car, sedan, and SUV.
  const bodyH=type==='suv'?72:type==='sedan'?68:64;
  const bodyW=type==='suv'?48:type==='sedan'?46:44;

  ctx.shadowBlur=18;
  ctx.shadowColor=color;
  ctx.fillStyle=color;
  ctx.beginPath();

  if(type==='suv'){
    ctx.roundRect(-bodyW/2,-bodyH/2,bodyW,bodyH,7);
    ctx.fill();
    ctx.fillStyle='#18283b';
    ctx.fillRect(-18,-24,36,23);
    ctx.fillStyle='#24384c';
    ctx.fillRect(-19,2,38,15);
  }else if(type==='sedan'){
    ctx.moveTo(-20,30);
    ctx.lineTo(-22,4);
    ctx.quadraticCurveTo(-20,-9,-14,-25);
    ctx.quadraticCurveTo(0,-35,14,-25);
    ctx.quadraticCurveTo(20,-9,22,4);
    ctx.lineTo(20,30);
    ctx.quadraticCurveTo(0,36,-20,30);
    ctx.fill();
    ctx.fillStyle='#18283b';
    ctx.beginPath();
    ctx.moveTo(-14,-7);ctx.lineTo(-10,-23);ctx.quadraticCurveTo(0,-29,10,-23);ctx.lineTo(14,-7);ctx.closePath();ctx.fill();
  }else{
    ctx.moveTo(-21,29);
    ctx.lineTo(-23,4);
    ctx.quadraticCurveTo(-20,-8,-13,-24);
    ctx.quadraticCurveTo(0,-31,13,-24);
    ctx.quadraticCurveTo(20,-8,23,4);
    ctx.lineTo(21,29);
    ctx.quadraticCurveTo(0,35,-21,29);
    ctx.fill();
    ctx.fillStyle='#15263a';
    ctx.beginPath();
    ctx.moveTo(-13,-8);ctx.lineTo(-9,-24);ctx.quadraticCurveTo(0,-28,9,-24);ctx.lineTo(13,-8);ctx.closePath();ctx.fill();
  }

  ctx.shadowBlur=0;

  // Windows
  ctx.fillStyle='#071321';
  if(type==='suv'){
    ctx.fillRect(-17,-22,34,20);
  }else{
    ctx.beginPath();
    ctx.roundRect(-14,-21,28,16,4);
    ctx.fill();
  }

  // Wheels / tires
  ctx.fillStyle='#05070b';
  ctx.fillRect(-bodyW/2-3,-17,6,18);
  ctx.fillRect(bodyW/2-3,-17,6,18);
  ctx.fillRect(-bodyW/2-3,12,6,18);
  ctx.fillRect(bodyW/2-3,12,6,18);

  // Headlights and rear lights
  ctx.fillStyle='#eaffff';
  ctx.fillRect(-16,20,8,4);
  ctx.fillRect(8,20,8,4);
  ctx.fillStyle='#ff334f';
  ctx.fillRect(-17,-27,7,3);
  ctx.fillRect(10,-27,7,3);

  // Front grille
  ctx.fillStyle='#050b13';
  ctx.fillRect(-10,27,20,3);

  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,w,h);
  const horizon=h*.31;
  const sky=ctx.createLinearGradient(0,0,0,horizon);
  sky.addColorStop(0,'#03040f');sky.addColorStop(1,'#13294b');
  ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);
  ctx.fillStyle='#060a12';ctx.fillRect(0,horizon,w,h-horizon);

  ctx.fillStyle='#101727';ctx.beginPath();
  ctx.moveTo(w*.5,horizon);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#45f4ff55';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(w*.5,horizon);ctx.lineTo(0,h);ctx.moveTo(w*.5,horizon);ctx.lineTo(w,h);ctx.stroke();

  for(let z=0;z<1;z+=.08){
    const zz=(z+roadScroll)%1;
    const y=roadY(zz);
    for(const lane of [-.31,.31]){
      const x=roadX(lane,zz);
      ctx.fillStyle='#dffcff55';
      ctx.fillRect(x-2,y,4,Math.max(3,14/(z+1)));
    }
  }
  for(const o of traffic){
    const x=roadX(o.x,o.z),y=roadY(o.z),s=.55+1/(1+o.z);
    drawCar(x,y,s,o.color,0,o.type);
  }
  const playerX=roadX(carX,.03);
  drawCar(playerX,h*.82+carBounce,1.22,'#45f4ff',carTilt,'sports');
  if(Math.abs(steer)>.05){
    ctx.save();ctx.globalAlpha=Math.min(.65,Math.abs(steer));ctx.strokeStyle='#45f4ff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(playerX-34,h*.88);ctx.lineTo(playerX-70-steer*18,h*.88+10);ctx.moveTo(playerX+34,h*.88);ctx.lineTo(playerX+70-steer*18,h*.88+10);ctx.stroke();ctx.restore();
  }
}
function loop(now){
  const dt=Math.min(.035,(now-last)/1000);last=now;
  update(dt);draw();
  if(playing)requestAnimationFrame(loop);
}
draw();
})();
</script>
</body>
</html>
