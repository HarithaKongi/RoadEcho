<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROAD ECHO — The Highway Remembers</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:Arial,sans-serif}
#game{display:block;width:100vw;height:100vh;background:#050611}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#12304c99,transparent 40%),#050611;z-index:5}
.panel{width:min(90vw,520px);padding:28px}.sub{letter-spacing:4px;color:#9cb0d2;font-size:12px;font-weight:700}
h1{font-size:clamp(58px,15vw,100px);line-height:.8;margin:18px 0;background:linear-gradient(#fff,#45f4ff,#6870ff);-webkit-background-clip:text;color:transparent}
.tag{font-size:18px;line-height:1.5;color:#dceaff;margin:20px}
button{width:100%;border:1px solid #9ffaff;border-radius:14px;background:linear-gradient(100deg,#087d9a,#5841c9);color:#fff;padding:16px;margin:8px 0;font-weight:800;font-size:17px;letter-spacing:1.5px;cursor:pointer}
#hud{position:fixed;top:14px;left:14px;right:14px;z-index:4;display:none;justify-content:space-between;pointer-events:none}
.box{background:#04081ecc;border:1px solid #45f4ff44;border-radius:10px;padding:9px 13px;font-size:12px}.box b{font-size:17px}
#hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#9cb0d2;font-size:12px;z-index:4;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu"><div class="panel">
<div class="sub">A MEMORY-DRIVEN ARCADE EXPERIENCE</div>
<h1>ROAD<br>ECHO</h1>
<div class="tag">The highway remembers what you did.<br>Then it makes you drive against it.</div>
<button id="start">ENTER THE ECHO</button>
</div></div>
<div id="hud"><div class="box">SCORE <b id="score">0</b></div><div class="box">DIST <b id="dist">0.0</b> km</div></div>
<div id="hint">← → / A D to steer</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const menu=document.getElementById('menu');
const startButton=document.getElementById('start');
const scoreEl=document.getElementById('score');
const distEl=document.getElementById('dist');
const hint=document.getElementById('hint');
let w=0,h=0,playing=false,last=0,score=0,distance=0,car=0,target=0,speed=120,keys={};
const traffic=[];
function resize(){w=innerWidth;h=innerHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function startGame(){
 playing=true;score=0;distance=0;car=0;target=0;speed=120;traffic.length=0;
 menu.style.display='none';document.getElementById('hud').style.display='flex';hint.style.display='block';
 last=performance.now();requestAnimationFrame(loop);
}
startButton.addEventListener('click',startGame);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '&&!playing)startGame()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false});
function spawn(){traffic.push({x:(Math.random()*2-1)*.8,z:1.2})}
function update(dt){
 if(!playing)return;
 if(keys.left)target-=2.4*dt;if(keys.right)target+=2.4*dt;
 target=Math.max(-.9,Math.min(.9,target));car+=(target-car)*Math.min(1,dt*8);
 distance+=speed*dt/3600;score+=speed*dt*.12;
 if(Math.random()<dt*.8)spawn();
 for(const o of traffic)o.z-=dt*(.35+speed/180);
 for(const o of traffic){if(o.z<.18&&Math.abs(o.x-car)<.22){playing=false;hint.textContent='CRASH — refresh the page to play again';}}
 while(traffic.length&&traffic[0].z<-.2)traffic.shift();
 scoreEl.textContent=Math.floor(score);distEl.textContent=distance.toFixed(1);
}
function roadX(x,z){return w/2+x*w*.36/(1+z*.7)}
function roadY(z){return h*.32+(1/(1+z*.7))*h*.55}
function drawCar(x,y,s,color){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;ctx.shadowBlur=18;ctx.shadowColor=color;
 ctx.beginPath();ctx.roundRect(-22,-42,44,66,9);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle='#071321';ctx.fillRect(-15,-29,30,20);ctx.fillStyle='#dffcff';ctx.fillRect(-17,12,7,4);ctx.fillRect(10,12,7,4);ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,w,h);
 const horizon=h*.32;
 const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#03040f');sky.addColorStop(1,'#13294b');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);
 ctx.fillStyle='#060a12';ctx.fillRect(0,horizon,w,h-horizon);
 ctx.fillStyle='#101727';ctx.beginPath();ctx.moveTo(w*.5,horizon);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#45f4ff55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*.5,horizon);ctx.lineTo(0,h);ctx.moveTo(w*.5,horizon);ctx.lineTo(w,h);ctx.stroke();
 for(let z=0;z<1;z+=.1){const y=roadY(z);for(const lane of [-.33,.33]){const x=roadX(lane,z);ctx.fillStyle='#dffcff55';ctx.fillRect(x-2,y,4,Math.max(3,12/(z+1)))}} 
 for(const o of traffic){const x=roadX(o.x,o.z),y=roadY(o.z),s=.55+1/(1+o.z);drawCar(x,y,s,'#d9e1ee')}
 drawCar(roadX(car,.03),h*.82,1.15,'#45f4ff');
}
function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(playing)requestAnimationFrame(loop)}
draw();
})();
</script>
</body>
</html>
